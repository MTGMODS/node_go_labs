name: node-go-lab4

services:
  node:
    build: ./node-service
    container_name: lab4-license-node
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  go:
    build: ./go-service
    container_name: lab4-license-go
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
