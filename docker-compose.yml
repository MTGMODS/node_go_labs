name: node-go-labs

services:
  postgres:
    image: postgres:16-alpine
    container_name: labs-postgres
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: licenses
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labs -d licenses"]
      interval: 2s
      timeout: 5s
      retries: 20

  node:
    build: ./node
    container_name: labs-license-node
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://labs:labs@postgres:5432/licenses?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  go:
    build: ./go
    container_name: labs-license-go
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://labs:labs@postgres:5432/licenses?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: labs-web
    ports:
      - "8081:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node
      - go

volumes:
  pgdata:
